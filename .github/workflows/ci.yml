name: CI

# npm ist der verbindliche Paketmanager dieses Projekts (siehe
# docs/DECISION_LOG.md). package.json deklariert "packageManager":
# "npm@10.9.4"; package-lock.json ist die einzige committete Lockdatei.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: "postgresql://app_user:app_password@localhost:5432/ki_cross?schema=public"
  NODE_ENV: "test"
  DEV_AUTH_SECRET: "ci-only-placeholder-secret"
  RENEWAL_LOOKAHEAD_DAYS_DEFAULT: "180"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: ki_cross
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_user -d ki_cross"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Prisma Client generieren
        run: npx prisma generate

      - name: Migrationen gegen Test-DB anwenden
        run: npx prisma migrate deploy

      - name: Lint (ESLint)
        run: npm run lint

      - name: Formatierung pruefen (Prettier)
        run: npm run format

      - name: Typpruefung (tsc --noEmit)
        run: npm run typecheck

      - name: Unit-Tests
        run: npm run test:unit

      - name: Integrationstests (echte Postgres-DB)
        run: npm run test:integration

      - name: Produktions-Build
        run: npm run build
